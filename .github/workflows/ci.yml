name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/domain } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/domain/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fcc, POSTGRES_PASSWORD: fcc, POSTGRES_DB: fcc_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fcc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fcc:fcc@localhost:5432/fcc_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  sim-bank:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fcc, POSTGRES_PASSWORD: fcc, POSTGRES_DB: fcc_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fcc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://fcc:fcc@localhost:5432/fcc_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: sim-bank
      - run: npm run typecheck
        working-directory: sim-bank
      - run: npm test
        working-directory: sim-bank

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
